*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
#tl{position:fixed;left:20px;top:calc(16px + env(safe-area-inset-top,0px));max-width:min(540px,54vw)}
#env{display:inline-block;font-size:13px;font-weight:600;color:var(--amber);border:1px solid var(--amber);border-radius:99px;padding:3px 12px}
h1{margin:8px 0 10px;font-size:clamp(22px,3.3vw,40px);font-weight:800;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--amber)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#tm{font-size:13px;padding:6px 12px}
#lensw{position:fixed;right:20px;top:calc(16px + env(safe-area-inset-top,0px));width:clamp(120px,17vw,210px);text-align:center}
#lc{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid var(--amber);box-shadow:0 0 28px rgba(245,158,11,.45);display:block;background:#080b12}
#lenslab{margin-top:8px;font-size:14px;font-weight:600;text-shadow:0 1px 8px #000}
#lenslab small{display:block;color:var(--mut);font-weight:400;font-size:12px}
#closing{position:fixed;left:50%;top:15%;transform:translateX(-50%);width:min(580px,88vw);text-align:center;font-size:clamp(18px,2.4vw,26px);font-weight:800;line-height:1.3;opacity:0;transition:opacity 1s;pointer-events:none;text-shadow:0 2px 16px #000}
#bar{position:fixed;left:0;right:0;bottom:0;padding:26px 20px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(14,19,31,0),rgba(14,19,31,.94) 32%)}
#scrub{position:relative;height:26px;margin:0 12px 10px}
#track,#fill{position:absolute;left:0;top:12px;height:3px;border-radius:2px}
#track{right:0;background:var(--line)}#fill{background:var(--amber);width:0}
.dot{position:absolute;top:4px;width:18px;height:18px;padding:0;border-radius:50%;transform:translateX(-50%);background:var(--bg);border:2px solid var(--mut)}
.dot.on{background:var(--amber);border-color:var(--amber)}
.dot.cur{box-shadow:0 0 0 4px rgba(245,158,11,.35)}
#row{display:flex;gap:14px;align-items:stretch}
#story{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:clamp(14px,1.5vw,18px);line-height:1.45;min-height:66px;max-width:900px}
#ctl{display:flex;gap:8px;align-items:center}
#ctl button{min-width:76px}#play{background:var(--amber);color:#1a1100;border-color:var(--amber)}
body.teacher #ctl,body.teacher #scrub .dot:not(.cur){display:none}
body.teacher #story{font-size:clamp(18px,2vw,26px)}
@media (max-width:700px){#row{flex-direction:column}#ctl{justify-content:center}}
@media (prefers-reduced-motion:reduce){#closing{transition:none}}
