<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Mole</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--cy:#22d3ee;--am:#fbbf24;--sl:#94a3b8;--ink:#070b14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 0}
header{text-align:center;margin-bottom:16px}
h1{margin:0;font-size:2.2rem;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--sl)}
main{flex:1;width:100%;max-width:880px;display:flex;justify-content:center;overflow:hidden}
.sc{width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;animation:fi .35s both}
@keyframes fi{from{opacity:0;transform:translateX(40px)}}
nav{position:sticky;bottom:0;width:100%;display:flex;justify-content:center;align-items:center;gap:18px;padding:14px 0;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.pill{padding:8px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:none;color:#cbd5e1;font-size:.9rem;font-weight:500}
.pill:hover{border-color:rgba(255,255,255,.6)}
.pill.on{background:var(--cy);border-color:var(--cy);color:#000}
.pill.am.on{background:var(--am);border-color:var(--am)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:none;font-size:1.2rem}
.arrow:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:8px;align-items:center}
.dots button{border:0;padding:0;height:8px;width:8px;border-radius:9px;background:rgba(255,255,255,.25);transition:width .3s}
.dots button.on{width:28px;background:var(--cy)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
@media(max-width:640px){.grid2{grid-template-columns:1fr}h1{font-size:1.8rem}}
.card{border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:22rem;border:1px solid}
.card.a{background:rgba(251,191,36,.05);border-color:rgba(251,191,36,.3)}
.card.c{background:rgba(34,211,238,.05);border-color:rgba(34,211,238,.3)}
.card h3{margin:0;font-size:1.4rem;text-align:center}
.a h3,.am{color:#fcd34d}.c h3,.cy{color:#67e8f9}
.mono{font-family:ui-monospace,Menlo,monospace}
.big{font-size:3rem;font-weight:900}
.mut{color:var(--sl)}
sup{font-size:.65em}
.egg{width:44px;height:56px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#fef3c7;box-shadow:0 0 14px rgba(251,191,36,.5)}
.carton{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border-radius:16px;background:rgba(120,53,15,.3);border:2px solid rgba(251,191,36,.4)}
.carton .egg{transition:all .5s}.carton.off .egg{transform:translateY(-30px) scale(0);opacity:0}
.beaker{position:relative;width:176px;height:224px;border:4px solid rgba(103,232,249,.6);border-top:0;border-radius:0 0 24px 24px;overflow:hidden}
.beaker i{position:absolute;bottom:0;left:0;right:0;height:100%;background:rgba(6,182,212,.2);transition:height 1.2s}
.beaker.off i{height:0}
.beaker b{position:absolute;width:6px;height:6px;border-radius:50%;background:#67e8f9;box-shadow:0 0 14px rgba(34,211,238,.6);animation:tw 2.2s infinite;transition:opacity .5s}
.beaker.off b{opacity:0;animation:none}
@keyframes tw{50%{opacity:.3;transform:translateY(-4px)}}
.pop{animation:pop .5s both}@keyframes pop{from{transform:scale(.4);opacity:0}}
.zin{animation:zi .9s both}.zout{animation:zo .9s both}
@keyframes zi{from{transform:scale(5);opacity:0}}@keyframes zo{from{transform:scale(.15);opacity:0}}
.view{width:320px;height:320px;border-radius:24px;overflow:hidden;background:#0b1420;border:1px solid rgba(34,211,238,.35);max-width:100%}
.drop{animation:dr 1s both cubic-bezier(.3,1.4,.5,1)}@keyframes dr{from{transform:translateY(-300px)}}
.tl{animation:tl 1.4s .3s both cubic-bezier(.3,1.6,.5,1)}
@keyframes tl{to{transform:rotate(12deg)}}
.pl{animation:pl 1.4s .3s both cubic-bezier(.3,1.6,.5,1)}@keyframes pl{to{transform:translateY(-34px)}}
.pr{animation:pr 1.4s .3s both cubic-bezier(.3,1.6,.5,1)}@keyframes pr{to{transform:translateY(34px)}}
.fade{animation:fi2 .8s both}@keyframes fi2{from{opacity:0;transform:translateY(10px)}}
.lines p{margin:0 0 12px;font-size:.95rem;animation:fi2 .6s both}
.tag{padding:10px 16px;border-radius:16px;text-align:center;font-weight:600;border:1px solid;width:100%}
.tag small{display:block;font-weight:400;opacity:.85;margin-top:2px}
.tag.am{border-color:var(--am);background:rgba(251,191,36,.1)}
.tag.cy{border-color:var(--cy);background:rgba(34,211,238,.1)}
.dim{opacity:.35}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.12);vertical-align:top}
th.am{color:#fcd34d}th.cy{color:#67e8f9}
td.s{background:rgba(255,255,255,.06)}
.badge{display:inline-block;padding:1px 8px;border-radius:9px;font-size:.75rem;font-weight:600;margin-right:6px}
.badge.same{background:#a7f3d0;color:#064e3b}.badge.diff{background:#fda4af;color:#4c0519}
.scroll{overflow-x:auto;width:100%}
.ion{opacity:.4;transition:opacity .3s}.ion.lit{opacity:1;stroke:#fff;stroke-width:1.2}.grn{animation:fl 1.1s linear infinite both}@keyframes fl{from{transform:translate(0,0);opacity:0}10%{opacity:1}to{transform:translate(var(--dx),168px)}}.shake{transform-origin:160px 60px;animation:sh .5s ease-in-out infinite}@keyframes sh{50%{transform:rotate(5deg)}}.heap{transform-origin:160px 274px;animation:hp 10s linear both}@keyframes hp{from{transform:scale(.3,.02)}}
.mark{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:5;display:flex;align-items:center;gap:9px;font:italic 700 1.3rem Georgia,"Times New Roman",serif;letter-spacing:.01em}
.mk{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--cy);color:var(--cy);display:grid;place-items:center;font:700 .72rem ui-monospace,Menlo,monospace;box-shadow:0 0 14px rgba(34,211,238,.35)}
header{margin-bottom:12px}header p{margin:0;font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:800;letter-spacing:-.02em;color:#fff}
@media(max-width:640px){header{margin-top:40px}}
.s5{gap:10px}.s5 .grid2{grid-template-columns:1fr 1fr;gap:10px}.s5 .card{padding:8px 12px;gap:4px;border-radius:20px}.s5 .card h3{font-size:.95rem}.s5 svg{width:100%;height:calc((100vh - 450px)/2);min-height:110px;max-height:200px}.s5 .tag{padding:6px 12px;font-size:.92rem}.s5 .cap{font-size:.78rem}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="mark"><span class="mk">mol</span>The Mole</div>
<header><p id="sub"></p></header>
<main id="main"></main>
<nav>
<button class="arrow" id="prev" aria-label="Previous">‹</button>
<div class="dots" id="dots"></div>
<button class="arrow" id="next" aria-label="Next">›</button>
</nav>
<script>
const NA='6.02 × 10<sup>23</sup>';
const S={i:0,dir:1,z:0,zd:1,n:0,full:1,bare:0,chem:0,st:0,s4:0,tm:null};
const TITLES=['Too many to count','Counting','Where 6.02 × 10²³ comes from','Number ≠ mass','Relative atomic mass vs molar mass','Comparison table'];
const pill=(txt,fn,on=1,cls='')=>`<button class="pill ${cls} ${on?'on':''}" onclick="${fn}">${txt}</button>`;

/* ---- Scene 0 ---- */
const grid=(c,g)=>{let o='';for(let r=0;r<c;r++)for(let k=0;k<c;k++){const i=r*c+k,na=(r+k)%2==0,big=c>5;o+=`<circle class="ion${i<S.n?' lit':''}" cx="${160+(k-(c-1)/2)*g}" cy="${160+(r-(c-1)/2)*g}" r="${na?(big?3.5:11):(big?6:19)}" fill="${na?'#22d3ee':'#e879f9'}"/>`}return o};
const faceIons=(o,u,v,k=7)=>{let s='';for(let j=0;j<k;j++)for(let i=0;i<k;i++){const a=(i+.5)/k,b=(j+.5)/k,na=(i+j)%2==0;s+=`<circle cx="${(o[0]+u[0]*a+v[0]*b).toFixed(1)}" cy="${(o[1]+u[1]*a+v[1]*b).toFixed(1)}" r="${na?1.6:2.8}" fill="${na?'#22d3ee':'#e879f9'}"/>`}return s};
const cube=[['160,70 215,102 160,134 105,102','.22',[160,70],[55,32],[-55,32]],['105,102 160,134 160,204 105,172','.1',[105,102],[55,32],[0,70]],['160,134 215,102 215,172 160,204','.04',[160,134],[55,-32],[0,70]]].map(f=>`<polygon points="${f[0]}" fill="rgba(255,255,255,${f[1]})" stroke="#fff" stroke-width="1.5"/>`+faceIons(f[2],f[3],f[4])).join('');
const salt=()=>{let g='';for(let i=0;i<46;i++)g+=`<circle class="grn" cx="${156+(i%5)*2}" cy="104" r="1.8" fill="#f8fafc" style="--dx:${((i*37)%50)-25}px;animation-delay:${(i%23)*.06}s"/>`;
 return `<rect x="30" y="274" width="260" height="6" rx="3" fill="#334155"/><path class="heap" d="M108,274 Q160,190 212,274Z" fill="#f8fafc" stroke="#cbd5e1"/>${g}<g class="shake"><rect x="130" y="14" width="60" height="76" rx="8" fill="rgba(148,163,184,.25)" stroke="#94a3b8"/><rect x="133" y="40" width="54" height="48" rx="5" fill="#f8fafc"/><rect x="126" y="90" width="68" height="14" rx="4" fill="#64748b"/><circle cx="148" cy="97" r="1.6" fill="#0b1420"/><circle cx="160" cy="97" r="1.6" fill="#0b1420"/><circle cx="172" cy="97" r="1.6" fill="#0b1420"/></g>`};
const legend='<circle cx="16" cy="18" r="4" fill="#22d3ee"/><text x="26" y="22" font-size="12" fill="#e2e8f0">Na⁺</text><circle cx="66" cy="18" r="6" fill="#e879f9"/><text x="78" y="22" font-size="12" fill="#e2e8f0">Cl⁻</text>';
const LAY=[['ions','2.8 × 10<sup>−8</sup> cm'],['lattice','5 × 10<sup>−7</sup> cm'],['grain','5 × 10<sup>−2</sup> cm'],['pinch','1 cm']];
function sc0(){
 const z=S.z,svg=[grid(4,64)+legend,grid(12,24)+legend,cube,salt()][z];
 const info=z<2?`<div class="big cy" id="cnt">${S.n}</div><div class="mut" style="font-size:.9rem">counting one ion at a time…</div>`
 :z==2?`<div style="font-size:1.7rem;font-weight:900">1 grain ≈ 5 × 10<sup>18</sup> ions</div><div class="mut">1 per second ≈ 1.6 × 10<sup>11</sup> years</div>`
 :`<div style="font-size:1.7rem;font-weight:900">1 pinch ≈ 6 × 10<sup>21</sup></div><div style="color:#fda4af">≈ 2 × 10<sup>14</sup> years</div><div class="mut" style="font-size:.9rem">Universe: 1.4 × 10<sup>10</sup> years</div><div class="cy" style="font-family:system-ui;font-weight:600">Count in bundles → the mole</div>`;
 return `<div class="view"><div class="${S.zd>0?'zin':S.zd<0?'zout':''}" style="width:100%;height:100%"><svg viewBox="0 0 320 320" width="100%" height="100%">${svg}</svg></div></div>
 <div class="row" style="gap:8px">${LAY.map((l,k)=>`<button onclick="zoom(${k})" class="pill" style="padding:4px 12px;border-radius:12px;font-size:.75rem;${k==z?'border-color:#22d3ee;background:rgba(34,211,238,.15);color:#a5f3fc':''}">${l[0]}<br><span class="mono">${l[1]}</span></button>`).join('')}</div>
 <div class="mono" style="height:96px;text-align:center">${info}</div>
 <div class="row">${pill('− Zoom in',`zoom(${z-1})`,0)}${pill('Zoom out +',`zoom(${z+1})`)}${pill('↻ Replay','S.n=0;S.zd=0;draw()',0)}</div>`;
}
function zoom(k){if(k<0||k>3||k==S.z)return;S.zd=k>S.z?1:-1;S.z=k;draw()}

/* ---- Scene 1 ---- */
function sc1(){
 const off=S.full?'':'off',dots=Array.from({length:140},(_,i)=>`<b style="left:${8+(i*37)%84}%;top:${8+(i*53)%84}%;animation-delay:${(i%7)*.12+i*.005}s"></b>`).join('');
 return `<div class="grid2">
 <div class="card a"><h3>1 Dozen = 12 (顆) eggs</h3><div style="flex:1;display:flex;align-items:center"><div class="carton ${off}">${'<div class="egg"></div>'.repeat(12)}</div></div></div>
 <div class="card c"><h3>1 Mole = ${NA} (粒) particles</h3><div style="flex:1;display:flex;align-items:center"><div class="beaker ${off}"><i></i>${dots}</div></div></div></div>
 <div class="tag cy" style="max-width:760px">Avogadro constant: L = ${NA} particles mol<sup>−1</sup><small>The number of particles in exactly 1 mole, just as a dozen always means 12. Number of particles = amount in mol × L.</small></div>
 ${pill(S.full?'Empty':'Fill',"S.full=!S.full;draw()",0)}`;
}

/* ---- Scene 2 ---- */
function sc2(){
 const c=S.chem,col=c?'#22d3ee':'#fbbf24',c2=c?'#a5f3fc':'#fde68a';
 const L=c?`<circle cx="0" cy="-14" r="12" fill="#67e8f9"/>`:`<text x="0" y="-4" font-size="42" text-anchor="middle">🪶</text>`;
 const R=c?[0,1,2,3,4,5].map(i=>`<rect x="${-30+i*10}" y="${-18-(i%2)*10}" width="20" height="20" rx="3" fill="#fff"/>`).join(''):[-18,0,18].map(x=>`<circle cx="${x}" cy="-14" r="16" fill="#f59e0b" stroke="#fde68a" stroke-width="2"/>`).join('');
 const pan=(x,cls,body,lab)=>`<g transform="translate(${x} 70)"><g class="${cls}"><line x1="0" y1="0" x2="0" y2="30" stroke="#64748b"/><g transform="translate(0 76)">${body}</g><rect x="-60" y="78" width="120" height="6" rx="3" fill="${col}"/><text x="0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="${c2}">${lab}</text></g></g>`;
 return `<div class="row">${pill('Everyday',"S.chem=0;draw()",!c,'am')}${pill('Chemistry',"S.chem=1;draw()",c)}</div>
 <svg viewBox="0 0 400 300" style="width:100%;max-width:560px;height:auto">
 <rect x="198" y="64" width="4" height="210" rx="2" fill="#475569"/><rect x="160" y="270" width="80" height="10" rx="4" fill="#475569"/>
 <g class="tl" style="transform-origin:200px 70px"><rect x="50" y="68" width="300" height="5" rx="2" fill="${c2}"/></g>
 ${pan(52,'pl',L,c?'1 mol H₂ · 2 g':'1 dozen feathers')}${pan(348,'pr',R,c?'1 mol NaCl · 58.5 g':'1 dozen bowling balls')}</svg>
 <p class="fade" style="font-size:1.25rem;font-weight:600;color:${col};animation-delay:1s">Same number, different mass.</p>`;
}

/* ---- Scene 3 ---- */
function sc3(){
 const st=S.st;let nuc='';const add=(x,y,p)=>nuc+=`<circle cx="${70+x}" cy="${70+y}" r="11" fill="${p?'#fb7185':'#cbd5e1'}"/>`;
 add(0,0,1);[0,1,0,1,0,1].forEach((p,k)=>add(Math.cos(k/6*6.283)*26,Math.sin(k/6*6.283)*26,p));[0,1,0,1,0].forEach((p,k)=>add(Math.cos(.5+k/5*6.283)*50,Math.sin(.5+k/5*6.283)*50,p));
 const left=st==0?`<div style="display:flex;flex-direction:column;align-items:center;gap:12px"><div style="width:96px;height:64px;border-radius:40% 60% 50% 50%;background:linear-gradient(135deg,#475569,#000);border:1px solid #64748b"></div><div class="mono cy" style="width:190px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:#0f172a;border:1px solid #475569">12.00 g</div></div>`
 :`<svg class="pop" viewBox="0 0 140 140" width="${st==1?210:140}" height="${st==1?210:140}">${nuc}</svg>`;
 const lines=[`Mass of 1 proton or neutron ≈ 1.66 × 10<sup>−24</sup> g`,`Mass of 1 C-12 atom = 12 × (1.66 × 10<sup>−24</sup> g) = 1.992 × 10<sup>−23</sup> g`,`Atoms in 12 g = 12.00 g ÷ (1.992 × 10<sup>−23</sup> g/atom)`,`Result = <b class="cy">${NA} atoms</b>`];
 return `<div class="row" style="gap:40px;align-items:center;width:100%"><div style="width:280px;height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center">${left}<div style="height:24px;font-size:.85rem;margin-top:6px">${st==1?'<span style="color:#fda4af">● 6 protons</span> &nbsp; <span style="color:#cbd5e1">● 6 neutrons</span>':''}</div></div>
 ${st>=2?`<div class="lines mono" style="max-width:420px">${lines.map((l,k)=>`<p style="animation-delay:${k*.9}s">${l}</p>`).join('')}</div>`:''}</div>
 ${st==2?`<p class="fade" style="max-width:560px;text-align:center;animation-delay:3.8s"><b class="cy">1 mole = ${NA} (粒) particles</b><br>A mole is the exact number of atoms needed to make a substance’s unitless relative atomic mass perfectly equal to its mass in grams.</p>`:''}
 ${pill(['Zoom in','Calculate','Replay'][st],"S.st=(S.st+1)%3;draw()")}`;
}

/* ---- Scene 4: relative atomic mass vs molar mass, 2x2 ---- */
const grp=(x,y,col)=>Array.from({length:12},(_,i)=>`<circle cx="${x+(i%6)*13}" cy="${y-Math.floor(i/6)*14}" r="6" fill="${col}"/>`).join('');
const bal=(L,R,ll,m1,rl,m2,c)=>`<svg viewBox="0 28 420 178"><rect x="208" y="40" width="4" height="140" fill="#475569"/><rect x="170" y="176" width="80" height="10" rx="4" fill="#475569"/><rect x="60" y="38" width="300" height="5" rx="2" fill="${c}"/><line x1="60" y1="43" x2="60" y2="120" stroke="#64748b"/><line x1="360" y1="43" x2="360" y2="120" stroke="#64748b"/><rect x="20" y="120" width="80" height="5" rx="2" fill="${c}"/><rect x="320" y="120" width="80" height="5" rx="2" fill="${c}"/>${L}${R}<g text-anchor="middle" fill="${c}" font-size="13"><text x="60" y="146">${ll}</text><text x="358" y="146">${rl}</text><text x="60" y="165" font-size="12" opacity=".85">${m1}</text><text x="358" y="165" font-size="12" opacity=".85">${m2}</text></g></svg>`;
const sca=(A,B,v1,v2,l1,l2,c)=>`<svg viewBox="0 76 420 144">${A}${B}${[[30,v1],[230,v2]].map(p=>`<rect x="${p[0]}" y="150" width="160" height="42" rx="10" fill="#0f172a" stroke="#475569"/><text x="${p[0]+80}" y="180" text-anchor="middle" class="mono" font-size="21" font-weight="800" fill="${c}">${p[1]}</text>`).join('')}<text x="110" y="212" text-anchor="middle" font-size="13" fill="${c}">${l1}</text><text x="310" y="212" text-anchor="middle" font-size="13" fill="${c}">${l2}</text></svg>`;
const eggs=Array.from({length:12},(_,i)=>`<ellipse cx="${50+(i%6)*19}" cy="${136-Math.floor(i/6)*26}" rx="9" ry="12" fill="#fef3c7"/>`).join('');
const grapes=Array.from({length:12},(_,i)=>`<circle cx="${285+(i%6)*9}" cy="${142-Math.floor(i/6)*10}" r="4.5" fill="#a78bfa"/>`).join('');
const cell=(cls,t,svg,cap)=>`<div class="card ${cls}" style="min-height:0"><h3>${t}</h3>${svg}<div class="mono cap ${cls=='a'?'am':'cy'}" style="text-align:center">${cap}</div></div>`;
function sc4(){
 return `<div class="tag am">Relative atomic mass: compare single particles. A ratio, <b>no unit</b>.</div>
 <div class="grid2">
 ${cell('a','1 egg vs 1 grape',bal('<ellipse cx="60" cy="96" rx="18" ry="24" fill="#fef3c7"/>',grp(326,106,'#a78bfa'),'1 egg','60 g','12 grapes','5 g each','#fbbf24'),'60 g ÷ 5 g = 12 · grams cancel')}
 ${cell('c','1 carbon atom vs hydrogen atoms',bal('<circle cx="60" cy="98" r="22" fill="#22d3ee"/><text x="60" y="104" text-anchor="middle" font-weight="800" fill="#04121a">C</text>',grp(326,106,'#fff'),'1 carbon atom','1.99 × 10⁻²³ g','12 hydrogen atoms','1.67 × 10⁻²⁴ g each','#22d3ee'),'1.99×10⁻²³ g ÷ 1.67×10⁻²⁴ g ≈ 12 · grams cancel')}
 </div>
 <div class="tag cy">Molar mass: weigh one whole bundle (a dozen, a mole). It has a <b>unit</b>, g mol<sup>−1</sup>.</div>
 <div class="grid2">
 ${cell('a','1 dozen of each, weighed',sca(eggs,grapes,'720 g','60 g','1 dozen eggs','1 dozen grapes','#fcd34d'),'720 g per dozen vs 60 g per dozen · still 12 ×')}
 ${cell('c','1 mole of each, weighed',sca('<polygon points="50,150 110,80 170,150" fill="#475569" stroke="#22d3ee" stroke-width="2"/>','<polygon points="285,150 310,128 335,150" fill="#f8fafc"/>','12 g','1 g','1 mol carbon','1 mol hydrogen','#67e8f9'),'12 g mol<sup>−1</sup> vs 1 g mol<sup>−1</sup> · still 12 ×')}
 </div>`;
}
function sc5(){
 const r=(a,b,c,k)=>`<tr><td>${k?'<span class="badge same">same value</span>':'<span class="badge diff">differs</span>'}<b>${a}</b></td><td class="${k?'s':''}">${b}</td><td class="${k?'s':''}">${c}</td></tr>`;
 return `<div class="scroll"><table><tr><th></th><th class="am">Relative atomic mass</th><th class="cy">Molar mass</th></tr>
 ${r('What it compares','Mass of one atom ÷ (1/12 of a C-12 atom)','Mass of one mole of atoms',0)}
 ${r('Unit','None (a ratio)','g mol<sup>−1</sup>',0)}
 ${r('Sample','A single atom','One mole, a weighable amount (6.02 × 10²³ atoms)',0)}
 ${r('Reference point','C-12 is exactly 12','1 mol of C-12 is exactly 12 g',0)}
 ${r('Carbon','<b>12</b>','<b>12</b> g mol<sup>−1</sup>',1)}
 ${r('Hydrogen','<b>1</b>','<b>1</b> g mol<sup>−1</sup>',1)}</table></div>
 <p class="mut" style="text-align:center;max-width:560px;margin:0">Only the numerical value is the same. Relative atomic mass is the bare number; molar mass is that number with the unit g mol<sup>−1</sup>.</p>`;
}

const SC=[sc0,sc1,sc3,sc2,sc4,sc5];
function draw(){
 document.getElementById('main').innerHTML='<div class="sc'+(S.i==4?' s5':'')+'" style="animation:'+(S.fresh?'fi .35s both':'none')+'">'+SC[S.i]()+'</div>';
 S.fresh=0;
 document.getElementById('sub').textContent=TITLES[S.i];
 document.getElementById('prev').disabled=S.i==0;document.getElementById('next').disabled=S.i==SC.length-1;
 document.getElementById('dots').innerHTML=SC.map((_,n)=>`<button class="${n==S.i?'on':''}" aria-label="Scene ${n+1}" onclick="go(${n})"></button>`).join('');
 clearInterval(S.tm);
 if(S.i==0&&S.z<2)S.tm=setInterval(()=>{S.n++;const e=document.getElementById('cnt');if(e)e.textContent=S.n;const c=document.querySelectorAll('.ion')[S.n-1];if(c)c.classList.add('lit')},450);
}
function go(n){if(n<0||n>=SC.length||n==S.i)return;S.i=n;S.fresh=1;draw()}
document.getElementById('prev').onclick=()=>go(S.i-1);
document.getElementById('next').onclick=()=>go(S.i+1);
S.fresh=1;draw();
</script>
</body>
