<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecological Pyramids: Numbers and Biomass</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{--bg:#EDF3F0;--card:#fff;--ink:#12302A;--mute:#4B6760;--line:#CFDDD7;--p:#1F7A4D;--c1:#A8660B;--c2:#B23A48;--pl:#0F7C8C;--zo:#A8660B;--accent:#12302A;--onaccent:#fff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A17;--card:#162823;--ink:#E6F1EC;--mute:#9DB8AF;--line:#2A433B;--p:#3DBA7B;--c1:#E0A23A;--c2:#E36B79;--pl:#3CBCCF;--zo:#E0A23A;--accent:#E6F1EC;--onaccent:#0E1A17}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;margin:0}
h1,h2,h3,.ui{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.seg button{padding:.55rem .9rem;border-radius:10px;font-weight:700;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.bar{transition:width 1s cubic-bezier(.2,.8,.2,1),opacity .6s;margin:0 auto;border-radius:10px;overflow:hidden;color:#fff}
.pop{animation:pop .4s both}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.fly{animation:fly 1s both}@keyframes fly{from{transform:translateY(-40px) scale(1.6);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:pl .8s infinite alternate}@keyframes pl{to{transform:scale(1.12)}}
.spawn{position:absolute;left:18%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--pl);animation:sp 1.1s linear forwards}
@keyframes sp{to{left:72%;opacity:0;transform:scale(.4)}}
.chip{transition:all .9s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react,env">
const {useState,useEffect,useMemo}=React;
const G='var(--p)',A='var(--c1)',R='var(--c2)',PL='var(--pl)',ZO='var(--zo)';
// widths = visual bar width (%), amount = label, items = dots/blocks inside bar
const S={
 'num-up':{kind:'num',inv:false,title:'Grassland',measures:'the count of individuals at each trophic level.',
  lv:[{n:'Grass',role:'Producer',e:'🌱',col:G,w:100,amt:'≈ 10,000 blades',k:60},{n:'Zebra',role:'Primary consumer',e:'🦓',col:A,w:42,amt:'≈ 40 zebras',k:14},{n:'Lion',role:'Secondary consumer',e:'🦁',col:R,w:12,amt:'1 lion',k:1}],
  how:'Count every individual in the area, one level at a time, then draw each level as a bar whose width matches the count. Thousands of grass blades feed dozens of zebras, which feed one lion.',
  why:'Each step up loses about 90% of the energy (heat, movement, waste, uneaten parts). Less energy means fewer individuals can be supported, so the numbers shrink toward the top. Here producers and consumers are of similar scale, so counts fall steadily and the pyramid is upright.'},
 'num-inv':{kind:'num',inv:true,title:'One oak tree',measures:'the count of individuals at each trophic level, no matter how big each one is.',
  lv:[{n:'Oak tree',role:'Producer',e:'🌳',col:G,w:6,amt:'1 tree',k:1},{n:'Birds',role:'Primary consumer',e:'🐦',col:A,w:38,amt:'≈ 50 birds',k:12},{n:'Parasites',role:'Secondary consumer',e:'🦠',col:R,w:100,amt:'≈ 50,000 parasites',k:70}],
  how:'Count individuals only. One tree is a single organism, however large, so the base is tiny. The birds are many, and each bird carries hundreds of microscopic parasites, so the top bar is the widest.',
  why:'A numbers pyramid ignores size. One huge producer can feed and house many small consumers, and each of those can host far more tinier ones. The count rises as body size falls, so the pyramid inverts. A biomass pyramid for the same chain would still be upright.'},
 'bio-up':{kind:'bio',inv:false,title:'Forest',measures:'the dry mass of living tissue at each level (kg of dry matter, not counting water).',
  lv:[{n:'Oak tree',role:'Producer',e:'🌳',col:G,w:100,amt:'≈ 5,000 kg',k:20},{n:'Caterpillars',role:'Primary consumer',e:'🐛',col:A,w:30,amt:'≈ 60 kg',k:6},{n:'Birds',role:'Secondary consumer',e:'🐦',col:R,w:8,amt:'≈ 2 kg',k:1}],
  how:'Collect organisms at each level, dry them to remove water, and weigh them. Each bar’s width shows the total mass. The whole tree weighs far more than every caterpillar feeding on it, which weigh more than the few birds.',
  why:'Biomass is stored energy. Only about 10% of the mass eaten becomes new consumer tissue, so each level holds much less than the one below. When producers live a long time and consumers cannot eat them faster than they regrow, the pyramid is upright.'},
 'bio-inv':{kind:'bio',inv:true,title:'Ocean',measures:'the dry mass of living tissue present at one moment (the standing crop).',
  lv:[{n:'Phytoplankton',role:'Producer',e:'🟢',col:PL,w:20,amt:'4 g/m² at this moment',k:2},{n:'Zooplankton',role:'Primary consumer',e:'🦐',col:ZO,w:100,amt:'21 g/m² at this moment',k:10}],
  how:'Take a snapshot: filter a sample of sea water, dry and weigh the phytoplankton, then do the same for zooplankton. The snapshot shows less producer mass than consumer mass.',
  why:'Why is this inverted? Phytoplankton reproduce so quickly (about once a day) that a small standing crop can support a much larger mass of zooplankton that consume them as fast as they grow. The snapshot is small, but the productivity over time is huge. Energy still flows upward with losses; the pyramid of energy per year is never inverted.'}
};
const DEF=n=>({num:'num',bio:'bio'}[n]);

function Chain({lv,kind}){return(
 <div className="flex items-center justify-center gap-1 sm:gap-3 flex-wrap py-6">
  {lv.map((l,i)=>(<React.Fragment key={l.n}>
   {i>0&&<div className="ui text-2xl" style={{color:'var(--mute)'}} aria-label="is eaten by">➜</div>}
   <div className="fly text-center" style={{animationDelay:i*.35+'s'}}>
    <div className="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl grid place-items-center text-5xl" style={{background:l.col}}>{l.e}</div>
    <div className="ui font-bold mt-2">{l.n}</div><div className="text-sm" style={{color:'var(--mute)'}}>{l.role}</div>
   </div></React.Fragment>))}
 </div>);}

function Pyramid({lv,kind,inv}){
 const [on,setOn]=useState(false);
 useEffect(()=>{const t=setTimeout(()=>setOn(true),80);return()=>clearTimeout(t)},[]);
 const rows=[...lv].reverse();
 return(<div className="py-4">
  <div className="ui text-sm mb-3" style={{color:'var(--mute)'}}>{kind==='num'?'Each dot is a group of individuals; bar width = how many.':'Each block is a share of dry mass; bar width = total mass.'}</div>
  {rows.map((l,ri)=>{const i=lv.length-1-ri;return(
   <div key={l.n} className="mb-2">
    <div className="bar p-2" style={{width:on?Math.max(l.w,16)+'%':'0%',background:l.col,transitionDelay:(i*.5)+'s',minWidth:on?'96px':0}}>
     <div className="flex items-center gap-2 justify-center ui font-bold"><span className="text-2xl">{l.e}</span><span className="truncate">{l.n}</span></div>
     <div className="flex flex-wrap gap-1 justify-center mt-1 max-h-[44px] overflow-hidden">
      {on&&Array.from({length:l.k}).map((_,j)=><span key={j} className="pop inline-block" style={{width:9,height:9,background:'rgba(255,255,255,.85)',borderRadius:kind==='num'?'50%':'2px',animationDelay:(i*.5+.8+j*.02)+'s'}}/>)}
     </div>
    </div>
    <div className="text-center text-sm mt-1"><b className="ui">{l.amt}</b></div>
   </div>)})}
  <div className="text-center ui font-bold mt-2" style={{color:inv?R:G}}>{inv?'Inverted: the top is wider than the base':'Upright: the base is widest'}</div>
 </div>);}

function Energy({lv}){return(
 <div className="py-4">
  <p className="ui font-bold mb-3">Energy passed up each level</p>
  {lv.map((l,i)=>(<div key={l.n} className="flex items-center gap-3 mb-2">
   <span className="text-2xl w-8">{l.e}</span>
   <div className="flex-1 h-8 rounded-lg" style={{background:'var(--line)'}}><div className="chip h-8 rounded-lg grid place-items-center text-white ui font-bold text-sm" style={{width:[100,10,1][i]<5?'8%':[100,10,1][i]+'%',background:l.col,minWidth:44}}>{['100%','≈10%','≈1%'][i]}</div></div>
  </div>))}
  <p className="text-sm" style={{color:'var(--mute)'}}>About 90% is lost at each step as heat, movement and waste, so higher levels can support less.</p>
 </div>);}

function WhyNum(){
 const [t,setT]=useState(0);
 useEffect(()=>{const id=setInterval(()=>setT(x=>x>=8?0:x+1),900);return()=>clearInterval(id)},[]);
 const big=t>=1;const parasites=Math.min(48,Math.max(0,(t-3))*10);
 return(<div className="py-3">
  <p className="ui font-bold mb-2">Size runs opposite to count</p>
  <div className="flex items-end justify-around mb-3" style={{height:150}}>
   {[['🌳',big?96:40,'1 tree','Huge: a whole habitat'],['🐦',big?40:40,'≈ 50 birds','Medium'],['🦠',big?14:40,'≈ 50,000','Microscopic']].map(([e,s,c,d],i)=>(
    <div key={i} className="text-center"><div className="chip leading-none" style={{fontSize:s}}>{e}</div><div className="ui font-bold text-sm">{c}</div><div className="text-xs" style={{color:'var(--mute)'}}>{d}</div></div>))}
  </div>
  <div className="rounded-xl p-3 relative" style={{background:'var(--bg)'}}>
   <div className="flex items-center gap-3">
    <div className="relative" style={{fontSize:70}}>🌳{big&&[0,1,2,3,4,5].map(i=><span key={i} className="pop absolute text-2xl" style={{left:[-6,30,60,6,44,72][i],top:[0,-6,6,40,34,40][i],animationDelay:i*.12+'s'}}>🐦</span>)}</div>
    <div className="text-sm">{t<1?'One oak tree…':t<3?'…gives food and shelter to many birds…':'…and each bird is a living habitat for hundreds of parasites. Zoom in:'}</div>
   </div>
   {t>=3&&<div className="pop mt-3 mx-auto rounded-full border-4 p-3 flex flex-wrap gap-1 content-start justify-center overflow-hidden" style={{width:150,height:150,borderColor:R,background:'var(--card)'}}>
    <span style={{fontSize:30,width:'100%',textAlign:'center'}}>🐦</span>
    {Array.from({length:parasites}).map((_,j)=><span key={j} className="pop inline-block rounded-full" style={{width:7,height:7,background:R}}/>)}
   </div>}
  </div>
 </div>);}

function WhyBio(){
 const [t,setT]=useState(0);
 useEffect(()=>{const id=setInterval(()=>setT(x=>x>=14?0:x+1),700);return()=>clearInterval(id)},[]);
 const made=4*t;
 const Row=({l,v,c,sub})=>(<div className="mb-2"><div className="flex justify-between text-sm ui"><b>{l}</b><span>{v}</span></div><div className="h-5 rounded-md" style={{background:'var(--line)'}}><div className="h-5 rounded-md chip" style={{width:Math.min(100,sub)+'%',background:c}}/></div></div>);
 return(<div className="py-3">
  <p className="ui font-bold mb-2">Time-lapse: Day {t} <span style={{color:'var(--mute)'}}>(one phytoplankton generation ≈ 1 day)</span></p>
  <div className="relative rounded-xl h-32 flex items-center justify-between px-6 overflow-hidden" style={{background:'var(--bg)'}}>
   <div className="pulse text-center"><div className="rounded-lg mx-auto" style={{width:30,height:30,background:PL}}/><div className="text-xs ui mt-1">phytoplankton<br/>small standing crop</div></div>
   {t>0&&<span key={t} className="spawn"/>}{t>0&&<span key={'b'+t} className="spawn" style={{top:'35%',animationDelay:'.2s'}}/>}{t>0&&<span key={'c'+t} className="spawn" style={{top:'65%',animationDelay:'.4s'}}/>}
   <div className="text-center"><div className="text-5xl">🦐</div><div className="text-xs ui">zooplankton<br/>eat them as they appear</div></div>
  </div>
  <div className="mt-3">
   <Row l="Phytoplankton at any moment" v="4 g/m² (stays small)" c={PL} sub={4/48*100}/>
   <Row l="Zooplankton at any moment" v="21 g/m²" c={ZO} sub={21/48*100}/>
   <Row l="Phytoplankton produced so far" v={made+' g/m²'} c={G} sub={made/48*100}/>
  </div>
  <p className="text-sm" style={{color:'var(--mute)'}}>Each day the small crop is eaten and regrown. After a few days, the total phytoplankton made far exceeds what zooplankton hold: high productivity from a low standing crop.</p>
 </div>);}

function App(){
 const [kind,setKind]=useState('num');const [inv,setInv]=useState(false);const [step,setStep]=useState(0);const [run,setRun]=useState(0);
 const key=kind+(inv?'-inv':'-up').replace('num-inv','').replace('bio-inv','');
 const id=kind+'-'+(inv?'inv':'up');const s=S[id];
 useEffect(()=>{setStep(0);const t=setTimeout(()=>setStep(1),2800);return()=>clearTimeout(t)},[id,run]);
 const steps=['1 Food chain','2 Build the pyramid','3 Why?'];
 return(<div className="max-w-6xl mx-auto p-4 sm:p-6">
  <header className="mb-5"><h1 className="text-3xl sm:text-4xl font-bold">Ecological pyramids</h1>
   <p style={{color:'var(--mute)'}}>See how a food chain becomes a pyramid, and why some pyramids turn upside down.</p></header>
  <div className="grid lg:grid-cols-5 gap-5">
   <main className="card p-4 sm:p-5 lg:col-span-3" aria-live="polite">
    <div className="flex flex-wrap gap-2 mb-2 seg" role="group" aria-label="Animation step">
     {steps.map((x,i)=><button key={x} aria-pressed={step===i} onClick={()=>setStep(i)}>{x}</button>)}
     <button onClick={()=>{setRun(r=>r+1)}} style={{marginLeft:'auto'}}>Replay</button>
    </div>
    <h2 className="text-xl font-bold mt-2">{s.title}: {kind==='num'?'pyramid of numbers':'pyramid of biomass'}</h2>
    <div key={id+step+run}>
     {step===0&&<Chain lv={s.lv} kind={s.kind}/>}
     {step===1&&<Pyramid lv={s.lv} kind={s.kind} inv={s.inv}/>}
     {step===2&&(!s.inv?<Energy lv={s.lv}/>:kind==='num'?<WhyNum/>:<WhyBio/>)}
    </div>
   </main>
   <aside className="lg:col-span-2 flex flex-col gap-4">
    <div className="card p-4">
     <div className="ui font-bold mb-2">What do you want to measure?</div>
     <div className="seg flex gap-2 mb-4"><button aria-pressed={kind==='num'} onClick={()=>setKind('num')}>Numbers</button><button aria-pressed={kind==='bio'} onClick={()=>setKind('bio')}>Biomass</button></div>
     <div className="ui font-bold mb-2">Which ecosystem?</div>
     <div className="seg flex gap-2"><button aria-pressed={!inv} onClick={()=>setInv(false)}>Normal (upright)</button><button aria-pressed={inv} onClick={()=>setInv(true)}>Inverted</button></div>
    </div>
    <div className="card p-4 leading-relaxed">
     <h3 className="font-bold text-lg mb-1">What it measures</h3>
     <p className="mb-3">This pyramid shows {s.measures}</p>
     <h3 className="font-bold text-lg mb-1">How it’s built</h3>
     <p className="mb-3">{s.how}</p>
     <h3 className="font-bold text-lg mb-1" style={{color:s.inv?R:G}}>{s.inv?'Why is this inverted?':'Why is this upright?'}</h3>
     <p>{s.why}</p>
     {step!==2&&<button className="ui font-bold mt-3 underline" onClick={()=>setStep(2)}>Show the animation for this</button>}
    </div>
    <div className="card p-3 flex flex-wrap gap-3 text-sm ui">
     <span><b style={{color:G}}>■</b> Producers</span><span><b style={{color:A}}>■</b> Primary consumers</span><span><b style={{color:R}}>■</b> Secondary consumers</span><span><b style={{color:PL}}>■</b> Phytoplankton</span>
    </div>
   </aside>
  </div>
 </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
